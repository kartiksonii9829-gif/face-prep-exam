<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arjun Kumar - Profile Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="banner"></div>
    <div class="avatar">AK</div>
    <h2>Arjun kumar</h2>
    <p class="role">web developer</p>
    <ul class="skills">
      <li>HTML</li>
      <li>CSS</li>
      <li>JAVASCRIPT</li>
      <li>GIT</li>
    </ul>
    <p class="followers"><span id="follower-count">120</span> followers</p>
    <button type="button" id="follow-btn" class="follow-btn">follow</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
